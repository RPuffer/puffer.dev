<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="icon" href="data:,">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>isoworld</title>
<style>
:root{--bg:#404040;--bar:#2e2e2e;--fg:#eee;--accent:#f5c243}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font:13px/1.3 system-ui,sans-serif}
body{display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom,0px)}
header{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:8px 16px;padding-top:calc(8px + env(safe-area-inset-top,0px));background:var(--bar)}
header b{margin-right:auto;letter-spacing:.04em}
button,input{font:inherit;color:var(--fg);background:#444;border:1px solid #555;border-radius:6px;padding:5px 10px}
button[aria-pressed=true]{background:var(--accent);color:#222;border-color:var(--accent)}
input{width:7em}
main{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:2px;min-height:0}
main.solo{grid-template-columns:1fr}
@media (max-width:700px){main{grid-template-columns:1fr;grid-template-rows:1fr 1fr}main.solo{grid-template-rows:1fr}}
section{position:relative;min-height:0;min-width:0}
section[hidden]{display:none}
section span{position:absolute;left:10px;top:8px;font-size:11px;opacity:.6;pointer-events:none}
iframe{width:100%;height:100%;border:0;display:block;background:var(--bg)}
</style>
</head>
<body>
<header>
  <b>isoworld</b>
  <button data-view="both" aria-pressed="true">both</button>
  <button data-view="3d" aria-pressed="false">3d</button>
  <button data-view="2d" aria-pressed="false">2d</button>
  <span id="ui"></span>
</header>
<main id="panes">
  <section id="p3d"><iframe id="f3d" title="3d build" allow="fullscreen"></iframe><span>3d</span></section>
  <section id="p2d"><iframe id="f2d" title="2d build" allow="fullscreen"></iframe><span>2d</span></section>
</main>
<script type="module">
import { mountUI } from "./core/ui.js";
let q = new URLSearchParams(location.search);
if (!q.get("level")) q.set("level", q.get("seed") ? "gen" : "home");
if (!q.get("seed")) q.set("seed", "1");
history.replaceState(null, "", "?" + q.toString() + location.hash);
const load = () => {
  const f = new URLSearchParams(q);
  f.delete("view");
  const s = "?" + f.toString();
  document.getElementById("f3d").src = "3d/index.html" + s;
  document.getElementById("f2d").src = "2d/index.html" + s;
  history.replaceState(null, "", "?" + q.toString() + location.hash);
};
const setView = (v) => {
  document.getElementById("p3d").hidden = v === "2d";
  document.getElementById("p2d").hidden = v === "3d";
  document.getElementById("panes").classList.toggle("solo", v !== "both");
  for (const b of document.querySelectorAll("[data-view]")) b.setAttribute("aria-pressed", String(b.dataset.view === v));
  q.set("view", v);
  history.replaceState(null, "", "?" + q.toString());
};
for (const b of document.querySelectorAll("[data-view]")) b.addEventListener("click", () => setView(b.dataset.view));
const ui = mountUI({
  container: document.getElementById("ui"),
  navigate: (s) => { q = new URLSearchParams(s); ui.setSeed(q.get("seed")); load(); },
});
setView(q.get("view") || "both");
load();
const started = performance.now();
const tick = setInterval(() => {
  const frames = [...document.querySelectorAll("section:not([hidden]) iframe")];
  const ready = frames.every((f) => {
    try { const w = f.contentWindow; return w.__done === true || !!w.__error || (w.document.readyState === "complete" && !w.document.querySelector("script[type=module]") ) || performance.now() - started > 15000; } catch { return true; }
  });
  if (ready) { clearInterval(tick); window.__done = true; }
}, 200);
</script>
</body>
</html>
