<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Ryne Puffer, select your fighter</title>
<link rel="icon" href="data:,">
<style>
:root{--bg:#14102a;--fg:#fff;--p1:#ff3b5c;--sun:#f5c243;--cyan:#3fe0ff;--ink:#120e22}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.3 system-ui,-apple-system,"Segoe UI",sans-serif}
body{min-height:100vh;padding:max(16px,env(safe-area-inset-top,0px)) 16px max(16px,env(safe-area-inset-bottom,0px));background:linear-gradient(160deg,#2b1a5c 0%,var(--bg) 45%,#2a0f2a 100%)}
.wrap{max-width:1160px;margin:0 auto}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}
h1{margin:0;font-size:clamp(22px,4.4vw,44px);font-weight:900;font-style:italic;letter-spacing:.02em;text-transform:uppercase;transform:skewX(-8deg);text-shadow:3px 3px 0 var(--p1),6px 6px 0 rgba(0,0,0,.35)}
.timer{font:900 italic clamp(26px,5vw,48px)/1 system-ui,sans-serif;color:var(--sun);text-shadow:3px 3px 0 #000;border:3px solid var(--sun);padding:2px 10px;transform:skewX(-8deg)}
.stage{display:grid;grid-template-columns:1.1fr 1fr;gap:18px;align-items:start}
.p1{position:relative;min-height:560px;overflow:hidden;border:3px solid var(--p1);background:#000;clip-path:polygon(0 0,100% 0,100% 92%,94% 100%,0 100%)}
.p1 .bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:blur(3px) saturate(1.2) brightness(.7);transform:scale(1.1)}
.p1 .hero{position:absolute;right:-4%;bottom:0;height:96%;width:auto;-webkit-mask:linear-gradient(90deg,transparent 0,#000 22%);mask:linear-gradient(90deg,transparent 0,#000 22%)}
.p1 .tag{position:absolute;left:0;top:14px;background:var(--p1);color:#fff;font:900 italic 15px system-ui,sans-serif;padding:4px 14px 4px 12px;clip-path:polygon(0 0,100% 0,90% 100%,0 100%)}
.info{position:absolute;left:16px;bottom:16px;right:40%;z-index:1}
.info h2{margin:0;font:900 italic clamp(30px,4.6vw,56px)/.95 system-ui,sans-serif;text-transform:uppercase;text-shadow:3px 3px 0 #000}
.info .style{display:inline-block;background:rgba(10,8,22,.82);padding:2px 8px;margin:6px 0 12px;color:var(--cyan);font-weight:800;text-transform:uppercase;letter-spacing:.08em;font-size:13px}
.moves{list-style:none;margin:0;padding:0;display:grid;gap:7px}
.moves li{background:rgba(10,8,22,.82);border-left:4px solid var(--sun);padding:6px 10px;font-size:14px}
.moves b{display:block;color:var(--sun);font-style:italic;text-transform:uppercase;font-size:13px;letter-spacing:.04em}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.grid button{position:relative;padding:0;border:3px solid #3b3366;background:#000;color:#fff;cursor:pointer;overflow:hidden;aspect-ratio:1/1;transform:skewX(-4deg);font:inherit}
.grid img{display:block;width:100%;height:100%;object-fit:cover;transform:skewX(4deg) scale(1.08);transition:filter .15s}
.grid button span{position:absolute;left:0;right:0;bottom:0;padding:4px 6px;background:linear-gradient(transparent,rgba(0,0,0,.9));font:900 italic 13px system-ui,sans-serif;text-transform:uppercase;text-align:left}
.grid button:not([aria-pressed="true"]) img{filter:grayscale(.55) brightness(.7)}
.grid button[aria-pressed="true"]{border-color:var(--p1);box-shadow:0 0 0 3px var(--sun),0 0 24px var(--p1)}
.grid button[aria-pressed="true"]::after{content:"P1";position:absolute;top:4px;left:6px;background:var(--p1);font:900 italic 12px system-ui,sans-serif;padding:1px 6px}
.grid button:focus-visible{outline:3px solid var(--cyan);outline-offset:2px}
.same{margin:10px 0 0;color:#b9b0de;font-size:14px}
.go{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.go a{flex:1;min-width:10em;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:56px;font:900 italic 22px system-ui,sans-serif;text-transform:uppercase;text-decoration:none;color:var(--ink);background:var(--sun);clip-path:polygon(4% 0,100% 0,96% 100%,0 100%)}
.go a#continue{background:var(--cyan)}
.go a[hidden]{display:none}
.go a small{font:700 12px system-ui,sans-serif;text-transform:none}
.go a:hover,.go a:focus-visible{filter:brightness(1.15);outline:none;box-shadow:inset 0 0 0 3px #fff}
.blink{animation:blink 1.1s steps(2) infinite}
@keyframes blink{50%{opacity:.35}}
@media (prefers-reduced-motion:reduce){.blink{animation:none}}
@media (max-width:760px){
  .stage{grid-template-columns:1fr}
  .side{order:-1}
  .p1{min-height:430px}
  .p1 .hero{height:62%;right:-12%;top:0;bottom:auto}
  .info{right:16px}
  .grid{gap:6px}
  .grid button span{font-size:11px;padding:3px 4px}
}
</style>
</head>
<body>
<div class="wrap">
<header><h1>Select your fighter</h1><div class="timer" aria-hidden="true">99</div></header>
<div class="stage">
<section class="p1" aria-live="polite">
<img class="bg" id="bg" src="../assets/start/wizard-medium.jpg?v=2" alt="">
<img class="hero" src="hero.jpg" alt="The hero, a blocky figure with brown hair and a red shirt, mid-dance">
<div class="tag">PLAYER 1</div>
<div class="info"><h2 id="name"></h2><div class="style" id="style"></div><ul class="moves" id="moves"></ul></div>
</section>
<div class="side">
<div class="grid" id="grid" role="radiogroup" aria-label="Fighters"></div>
<p class="same">Nine fighters, one man: Ryne Puffer. Arrows to move, Enter to lock in.</p>
<div class="go">
<a id="begin" href="#"><span class="blink">Press start</span></a>
<a id="continue" href="#" hidden>Continue<small id="where"></small></a>
</div>
</div>
</div>
</div>
<script type="module">
import { wire, settle } from "./run.js";
import { startArt } from "../core/art.js";
const F = [
  ["Gatekeeper", "wizard-medium", "API ingress, WebSockets", [["Frame Throttle", "Closed a denial-of-service hole open in the WebSocket service since it shipped. No real customer got cut off."], ["Consistent Hash", "Moved service-to-service traffic onto network load balancers with consistent hashing and zone-aligned DNS."], ["Open Port", "Found every port on the termination fleet reachable from the internet and spelled out the attack path."]]],
  ["Pager Tamer", "cat-medium", "Alarm design, on-call", [["Minus 43", "Cut operator load across the ingress stack by about 43 percent of critical tickets a week."], ["Slow Burn", "Every relaxed alarm shipped beside a new slow-burn alarm, so sensitivity moved instead of vanishing."], ["Missing Data", "Root-caused false pages from a deregistration loop that ran for hours without metrics."]]],
  ["Agentwright", "mindbloom-medium", "AI agent tooling", [["Founder", "Founded the team's AI coding agent framework: 11 agents, 14 skills, 7 procedures from six engineers."], ["Guardrail Hook", "Blocks cloud and credential CLI commands from an agent's shell, prefixed, env-wrapped or eval-wrapped."], ["Unattended", "The hook is why the team lets agents run unattended."]]],
  ["Cert Warden", "ember-subject", "TLS certificates", [["Eleven Steps", "Replaced manual, region-by-region rotation with an automated 11-step procedure for 40+ certificates."], ["Weekly Duty", "Now a mandated weekly secondary on-call duty."], ["Spec", "Became the specification for a Python implementation that runs unattended."]]],
  ["Fleetwright", "dragon-medium", "Canaries, deployments", [["Four Partitions", "Took a new ingress canary fleet from one partition to production-hardened in four, post-quantum TLS included."], ["Consolidate", "Folded 7 auto scaling groups and 16 hosts into one deployment group that survives three host failures."], ["Rust Canary", "Caught several launch-critical bugs before a fixed conference deadline."]]],
  ["Modernizer", "forest-volute", "Legacy to cloud", [["Struts Breaker", "Converted Java Struts applications to a Node backend and a React, Redux frontend."], ["Claims Bridge", "A cloud Node service bridging legacy IBM DB2 and MQ for digital disability claims."], ["First Go", "Wrote the first Go application in the Benefits organization."]]],
  ["Polyglot", "gremlin-subject", "Rust, Go, Node, Rails, Java, Python", [["Fast Study", "Arrived with zero Ruby or GraphQL; shipped production work in both inside a month."], ["GraphQL Layer", "Built the GraphQL layer fronting a Rails backend serving e-commerce data."], ["Greenfield", "Every facet of a new Brand Portal: frameworks, data model, architecture, UX feedback."]]],
  ["Painter", "cosmos-frisket", "Visual art, self-taught", [["No School", "No formal training. The work speaks for itself."], ["Twelve Islands", "Every island in this world is built from one of his works."], ["RAW", "Official RAW artist. Portfolio at behance.net/SyntheticFlow."]]],
  ["Bard", "swallow-medium", "Violin, guitar, drums, production", [["Bow", "Classically trained violinist."], ["Self-Taught", "Taught himself guitar and drums."], ["Producer", "Composes and produces his own music."]]],
];
const grid = document.getElementById("grid"), bg = document.getElementById("bg");
F.forEach(([n, img], i) => {
  const b = document.createElement("button");
  b.type = "button"; b.setAttribute("role", "radio"); b.dataset.i = i;
  b.innerHTML = `<img src="${startArt(img)}" alt="" width="300" height="267"><span>${n}</span>`;
  grid.append(b);
});
const btns = [...grid.children];
const pick = (i, focus) => {
  const [n, img, style, moves] = F[i];
  btns.forEach((b, j) => { b.setAttribute("aria-pressed", j === i); b.setAttribute("aria-checked", j === i); b.tabIndex = j === i ? 0 : -1; });
  document.getElementById("name").textContent = n;
  document.getElementById("style").textContent = style;
  document.getElementById("moves").innerHTML = moves.map(([m, d]) => `<li><b>${m}</b>${d}</li>`).join("");
  bg.src = startArt(img);
  if (focus) btns[i].focus();
};
grid.addEventListener("click", (e) => { const b = e.target.closest("button"); if (b) pick(+b.dataset.i, true); });
grid.addEventListener("pointerover", (e) => { const b = e.target.closest("button"); if (b && e.pointerType === "mouse") pick(+b.dataset.i); });
grid.addEventListener("keydown", (e) => {
  const i = btns.indexOf(document.activeElement); if (i < 0) return;
  const d = { ArrowRight: 1, ArrowLeft: -1, ArrowDown: 3, ArrowUp: -3 }[e.key];
  if (d) { e.preventDefault(); pick((i + d + 9) % 9, true); }
  if (e.key === "Enter" || e.key === " ") { e.preventDefault(); document.getElementById("begin").focus(); }
});
pick(0);
await wire({ begin: document.getElementById("begin"), cont: document.getElementById("continue"), label: document.getElementById("where") });
await settle();
</script>
</body>
</html>
